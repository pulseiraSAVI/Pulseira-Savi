<!-- Ligação real (pivô de produção, revisão de 19/09/2026): já não corre
     por file:// — firebase-init.js é um módulo ES (só assim a Firebase
     JS SDK é distribuída), e os browsers bloqueiam `import` de módulos
     em file:// por CORS. Testar sempre por http(s): localmente com
     `cd docs && python3 -m http.server 8000`, ou já publicado no
     GitHub Pages.

     Ordem de carregamento: icons (biblioteca de SVG, sem dependências) ->
     dom-util (escapeHtml, sem dependências) -> firebase-init (módulo, ver
     nota acima) -> mockdb (só funções puras) -> firestore-real
     (acrescenta as funções de dados a window.mockdb) -> worker-real ->
     auth-real -> nav-helpers -> views -> router -> app.

     Auditoria de segurança de 25/09/2026
     (AUDITORIA_SEGURANCA_25-09-2026.md): os ficheiros de demo/simulação
     que nunca chegaram a ser carregados aqui (login-profissional.js,
     login-familia.js, scan.js, familia-pacientes.js,
     familia-paciente-detalhe.js, admin-pacientes.js,
     admin-nivel1-form.js, admin-profissionais.js, worker-sim.js,
     auth-sim.js) foram removidos do repositório — eram código órfão,
     inalcançável por qualquer rota da app desde o pivô de produção de
     15/09/2026. A família está suspensa nesta revisão (ver CLAUDE.md,
     "Pivô para produção") e o Nível 2 foi eliminado por completo.

     hash-util.js removido em 26/09/2026: só era usado para computar
     SHA-256(PIN) como password do Firebase Auth, esquema substituído por
     Custom Tokens (ver AUDITORIA_SEGURANCA_25-09-2026.md, achado C1) —
     ficou órfão e foi removido. -->
